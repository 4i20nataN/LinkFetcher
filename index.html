<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030406" />
    <meta name="description" content="LinkFetcher — Download de mídia inteligente com yt-dlp" />
    <title>LinkFetcher</title>
    <style>
      html,body,#root{height:100%;margin:0;padding:0;overflow:hidden;background:#030406;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif}
      #root{display:flex;flex-direction:column;height:100%}
      .lf-startup-splash {
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        height:100%;
        width:100%;
        background:#030406;
        user-select:none;
        transition:opacity .45s ease;
        padding:2rem;
        box-sizing:border-box;
      }
      .lf-startup-splash.lf-splash-hide {
        opacity:0;
        pointer-events:none;
      }
      .lf-startup-logo-wrapper {
        position:relative;
        width:96px;
        height:96px;
        margin-bottom:1.5rem;
        display:flex;
        align-items:center;
        justify-content:center;
      }
      .lf-startup-logo-glow {
        position:absolute;
        inset:-8px;
        border-radius:28px;
        background:radial-gradient(circle, rgba(6,182,212,0.45) 0%, rgba(168,85,247,0.3) 50%, transparent 70%);
        filter:blur(14px);
        animation:lf-pulse 2.2s ease-in-out infinite alternate;
      }
      .lf-startup-logo {
        position:relative;
        width:96px;
        height:96px;
        border-radius:24px;
        object-fit:cover;
        box-shadow:0 12px 30px rgba(0,0,0,0.6), 0 0 20px rgba(6,182,212,0.3);
        border:1px solid rgba(255,255,255,0.12);
        animation:lf-float 2.5s ease-in-out infinite alternate;
      }
      .lf-startup-title {
        font-weight:900;
        font-size:1.75rem;
        letter-spacing:-0.03em;
        background:linear-gradient(135deg, #ffffff 40%, #67e8f9 100%);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        margin-bottom:0.25rem;
      }
      .lf-startup-sub {
        font-size:0.8rem;
        color:#94a3b8;
        letter-spacing:0.12em;
        text-transform:uppercase;
        font-family:monospace;
        margin-bottom:2rem;
      }
      .lf-startup-loader {
        width:140px;
        height:4px;
        background:rgba(255,255,255,0.08);
        border-radius:999px;
        overflow:hidden;
        position:relative;
      }
      .lf-startup-loader::after {
        content:'';
        position:absolute;
        top:0;
        left:0;
        bottom:0;
        width:45%;
        background:linear-gradient(90deg, #06b6d4, #a855f7);
        border-radius:999px;
        animation:lf-slide 1.4s ease-in-out infinite;
      }
      @keyframes lf-pulse {
        0% { opacity:0.4; transform:scale(0.95); }
        100% { opacity:0.85; transform:scale(1.1); }
      }
      @keyframes lf-float {
        0% { transform:translateY(0); }
        100% { transform:translateY(-4px); }
      }
      @keyframes lf-slide {
        0% { left:-45%; }
        50% { left:40%; width:55%; }
        100% { left:100%; width:30%; }
      }
    </style>
  </head>
  <body>
    <div id="root" role="application" aria-label="LinkFetcher">
      <div class="lf-startup-splash">
        <div class="lf-startup-logo-wrapper">
          <div class="lf-startup-logo-glow"></div>
          <img src="/logo-dark.webp" alt="LinkFetcher" class="lf-startup-logo" />
        </div>
        <div class="lf-startup-title">LinkFetcher</div>
        <div class="lf-startup-sub">Media Downloader</div>
        <div class="lf-startup-loader"></div>
      </div>
    </div>
    <script>
      // Splash na cor do tema salvo: evita o flash preto antes do React.
      try {
        var s = JSON.parse(localStorage.getItem('universal_downloader_settings') || '{}');
        var bg = { light: '#f4f0e6', dark: '#0A0C12', gray: '#15161c', white: '#f7f9fc' }[s.themeMode] || '#0A0C12';
        document.documentElement.style.background = bg;
        var sp = document.querySelector('.lf-startup-splash');
        if (sp) sp.style.background = bg;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
