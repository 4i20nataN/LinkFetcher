name = "linkfetcher-licenses"
main = "worker.mjs"
compatibility_date = "2025-01-01"

# Preço/dias da oferta (tem que bater com PRO_PLAN no app).
[vars]
PRICE = "9.99"
PLAN_DAYS = "30"
# Vazio = usa o origin do Worker p/ notification_url. Preencha com o
# workers.dev (ou domínio próprio) depois do 1º deploy.
BASE_URL = "https://linkfetcher-licenses.linkfetcher.workers.dev"
# Remetente do e-mail da chave (tem que ser o e-mail verificado no Brevo).
# FORA DO REPO: configure como segredo — `wrangler secret put SMTP_FROM`.
# (O Worker lê env.SMTP_FROM igual; [vars] aqui exporia o endereço no git.)

# D1 — crie antes: wrangler d1 create linkfetcher-licenses
# e cole o database_id abaixo. Migrações versionadas em ./migrations:
# wrangler d1 migrations apply linkfetcher-licenses --remote
[[d1_databases]]
binding = "DB"
database_name = "linkfetcher-licenses"
database_id = "c37c4b47-eb82-4a8e-84b4-1abcd0032e94"
migrations_dir = "migrations"

# Rate limit durável (Cloudflare Workers) — funciona no workers.dev, sem
# precisar de domínio/zona. Cobra por IP e por local do Cloudflare.
# period só aceita 10 ou 60; namespace_id precisa ser único na conta.
[[ratelimits]]
name = "CHECKOUT_LIMITER"        # POST /api/checkout (criar Pix)
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RECOVER_LIMITER"         # /api/recover (reenvio de e-mail)
namespace_id = "1002"
  [ratelimits.simple]
  limit = 5
  period = 60
