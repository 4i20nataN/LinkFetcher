name: 'PR Check (lint + testes + build)'

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Testes do license server
        run: npm run test:server

      - name: Build frontend
        run: npm run build:frontend

      - name: Smoke E2E (Chromium headless)
        run: |
          npx playwright install --with-deps chromium || npx playwright install chromium
          npm run test:e2e

      - name: Plugin Android sincronizado (canônico → gen)
        run: node scripts/sync-android-plugin.mjs --check

  rust:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Rust + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # gtk-sys/gdk-sys (árvore do Tauri) pedem os -dev do WebKitGTK no
      # runner: sem isso `cargo test` morria no build antes do primeiro teste.
      - name: Instalar Dependências Linux (WebKitGTK e bibliotecas do sistema)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # generate_context! lê o frontendDist do tauri.conf.json: sem o
      # ../dist-web (job frontend não compartilha workspace), o proc macro
      # panica antes do primeiro teste. Um stub basta — Rust não executa a UI.
      - name: Stub do frontendDist (generate_context)
        run: mkdir -p dist-web && printf '<!doctype html><html></html>' > dist-web/index.html

      # --locked: a CI não pode re-resolver o Cargo.lock (o que está commitado
      # é o que auditamos e o que o release empacota).
      - name: Testes unitários Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy (desktop)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
