name: 'Auditoria de dependências (npm + cargo)'

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    # Semanal: CVEs novos em pins antigos aparecem sem depender de release.
    - cron: '0 6 * * 1'

jobs:
  npm:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      # Só prod embarca no bundle; dev (vite/tooling) reporta sem falhar.
      - name: Audit prod (falha no high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev (informativo)
        run: npm audit --audit-level=high || true

  cargo:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      # O crate vive em src-tauri/ (Cargo.lock lá). A action
      # embarkstudios/cargo-audit-action saiu do GitHub e o job morria em
      # "Set up job"; cargo-audit direto faz o mesmo check sem action.
      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked

      # Vulnerabilidade deixa o job vermelho; warning não — `--deny warnings`
      # falharia para sempre por advisories da árvore do Tauri (glib/tokio
      # unsound, zbus/zvariant/unic unmaintained, clipboard-win yanked), que
      # nenhuma versão nossa resolve. Eles continuam impressos no log.
      #
      # Os 3 ignores são o zip 4.6.1 puxado pelo tauri-plugin-updater: o
      # extract() vulnerável só roda sobre bytes que já passaram por
      # verify_signature (minisign) com a nossa chave de release, então o
      # arquivo malicioso que os advisories descrevem é impossível sem a chave.
      # Remover os ignores quando o stack do Tauri migrar para zip 9 (2.12+).
      - name: Audit Rust (RustSec)
        working-directory: src-tauri
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369
