name: 'Auditoria de dependências (npm + cargo)'

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    # Semanal: CVEs novos em pins antigos aparecem sem depender de release.
    - cron: '0 6 * * 1'

jobs:
  npm:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      # Só prod embarca no bundle; dev (vite/tooling) reporta sem falhar.
      - name: Audit prod (falha no high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev (informativo)
        run: npm audit --audit-level=high || true

  cargo:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      # O crate vive em src-tauri/ (Cargo.lock lá). A action
      # embarkstudios/cargo-audit-action saiu do GitHub e o job morria em
      # "Set up job"; cargo-audit direto faz o mesmo check sem action.
      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust (RustSec)
        working-directory: src-tauri
        run: cargo audit --deny warnings
